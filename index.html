const container = document.getElementById('cardsContainer');

function renderCards() {
    let cardsHTML = '';
    
    for (let i = 0; i < persons.length; i++) {
        let p = persons[i];
        cardsHTML += `
            <div class="card">
                <div class="card-inner">
                    <!-- Front Card: -->
                    <div class="card-front">
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    
                    <!-- Back Card:-->
                    <div class="card-back">
                        <div>
                            <h3>${p.name}</h3>
                            <p><strong>Age:</strong> ${p.age}</p>
                            <p><strong>Specialist:</strong> ${p.specialist}</p>
                            <p><strong>City:</strong> ${p.city}</p>
                            <p><strong>Email:</strong> ${p.email}</p>
                            <p><strong>Bio:</strong> ${p.bio}</p>
                        </div>
                        <a href="mailto:${p.email}" class="btn-details">View More Details</a>
                    </div>
                </div>
            </div>
        `;
    }
    
    container.innerHTML = cardsHTML;
}

            const introVideo = document.getElementById('introVideo');
            const introAudio = document.getElementById('introAudio');
            const videoOverlay = document.getElementById('videoOverlay');
            const soundNotice = document.getElementById('soundNotice');

            function playSyncedAudio() {
            introAudio.currentTime = introVideo.currentTime;
            
            introAudio.play().then(() => {
            
                if (soundNotice) soundNotice.classList.add('hidden');
            }).catch(error => {
                if (soundNotice) soundNotice.classList.remove('hidden');
            });
            }

            introVideo.addEventListener('play', () => {
            playSyncedAudio();
            });

            document.addEventListener('click', () => {
            if (introAudio.paused && !introVideo.ended) {
                playSyncedAudio();
            }
            });


            introVideo.addEventListener('seeking', () => {
            introAudio.currentTime = introVideo.currentTime;
            });

            introVideo.addEventListener('ended', () => {
            introAudio.pause(); 
            videoOverlay.classList.add('fade-out');

            setTimeout(() => {
                videoOverlay.style.display = 'none';
            }, 1000);
    });
